<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scoped CSS Variables and JS</title>
  <link rel="icon" href="https://fav.farm/🔥" />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
  <h2>Update CSS Variables with <span class='hl'>JS</span></h2>

  <div class="controls">
    <label for="spacing">Spacing:</label>
    <input id="spacing" type="range" name="spacing" min="10" max="200" value="10" data-sizing="px">

    <label for="blur">Blur:</label>
    <input id="blur" type="range" name="blur" min="0" max="25" value="1" data-sizing="px">

    <label for="base">Base Color</label>
    <input id="base" type="color" name="base" value="#ffc600">

    <label for="sepia">Sepia:</label>
    <input id="sepia" type="range" name="sepia" min="0" max="100" value="50" data-sizing="%">
  </div>

  <img src="img.JPG">

  <style>
    :root {
      --base: #c1af67;
      --spacing: 10px;
      --blur: 1px;
      --sepia: 50%;
    }

      img {
        padding: var(--spacing);
        background: var(--base);
        filter: blur(var(--blur)) sepia(var(--sepia));
        width: 800px;
      }

    .hl {
      color: var(--base);
    }

    h2 {
  font-size: 5rem;
  text-shadow: 5px 5px 4px rgba(18, 17, 17, 0.5);
  }

    /*
      misc styles, nothing to do with CSS variables
    */

    body {
      text-align: center;
      background: #1c1208;
      color: white;
      font-family: 'Special Elite', sans-serif;
      font-weight: 100;
      font-size: 35px;
    }

    .controls {
      margin-bottom: 50px;
    }

    input {
      width: 100px;
    }

    input[type="range"] {
      accent-color: var(--base);
    }
  </style>

  <script>
    const inputs = document.querySelectorAll('.controls input');

    function handleUpdate () {
      const suffix = this.dataset.sizing || '';
      document.documentElement.style.setProperty(`--${this.name}`, this.value + suffix);
    }

    inputs.forEach(input => input.addEventListener('change', handleUpdate));
    inputs.forEach(input => input.addEventListener('mousemove', handleUpdate));

  </script>

</body>
</html>
